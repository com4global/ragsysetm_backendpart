# RAG Query Prompt — Tamil/Thanglish addon
# Version: 2.0
# Used by: llm.py → query_llm_with_context(language="ta")
#
# This is APPENDED to the English prompt when Tamil is selected.

version: "2.0"
name: "rag_query_ta_addon"
description: "Tamil/Thanglish language addon for RAG query prompt"

system_prompt_addon: |
  CRITICAL LANGUAGE INSTRUCTION: You MUST respond in THANGLISH style.
  Use Tamil script (தமிழ்) as the primary language, but mix in English words naturally for technical terms, greetings, and common phrases.
  Use everyday conversational Tamil, NOT formal literary Tamil.
  Example: '[HRPolicy.pdf, Page 3] படி, இந்த policy-ன் main point என்னன்னா...'
  Document names, technical terms, and citation brackets can stay in English.
  For general knowledge prefix, use: '📌 *இந்த information உங்க documents-ல இல்ல. General knowledge-லிருந்து:*'
  Keep the tone friendly and easy to understand like daily Tamil conversation.
